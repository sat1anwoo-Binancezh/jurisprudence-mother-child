。"},{"label":"C","text":"该规定对于有关企业、政府及残疾人均具有指引作用","reason":"相关各方都可据规定决定怎样行动。"},{"label":"D","text":"该规定在交通、邮政、电信方面给予残疾人的优待，是形式平等的直接体现","reason":"合理差别待遇体现实质平等，不是形式平等。"}],"answer":"BD","multiple":true,"summary":"照顾残疾人的实际困难，是实质平等和正义，不是机械同等。","file":"【解析版】26法理母子题第三、四期，杜洪波，20250528.pdf","page":12,"note":"","typeConflict":false},{"uid":"j-3999627cccb7b94e","n":135,"sourceId":"30-1","chapter":"第五章 法的价值","section":"第二节 法的价值分类","topic":"30｜人权价值","kind":"母题","stem":"2016年9月，国务院新闻办公室发布《国家人权行动计划（2016—2020年）》，对我国人权事业发展做出全面部署。对此，下列说法正确的有（）（2018年法学多选第22题/非法学多选第42题）","options":[{"label":"A","text":"国家对保障人权负有重要责任","reason":"国家有尊重、保护人权的责任。"},{"label":"B","text":"人权就是公民依据宪法和法律享有的权利","reason":"人权还包括应当享有、尚未完全法定化的权利。"},{"label":"C","text":"现代人权的保护需要通过立法予以确认","reason":"立法确认能把人权诉求转成现实法律保障。"},{"label":"D","text":"司法机关在审判时应尊重和保障当事人的人权","reason":"审判也要尊重、保护当事人的人权。"}],"answer":"ACD","multiple":true,"summary":"人权不只已写入法律的权利；国家应通过立法、司法把它落实。","file":"【解析版】26法理母子题第三、四期，杜洪波，20250528.pdf","page":12,"note":"","typeConflict":false},{"uid":"j-d30d9c371cd52b46","n":136,"sourceId":"30-2","chapter":"第五章 法的价值","section":"第二节 法的价值分类","topic":"30｜人权价值","kind":"母题","stem":"下列有关人权的说法，不正确的有（）（2017年非法学多选第47题/法学多选第22题）","options":[{"label":"A","text":"只存在个体人权，不存在集体人权","reason":"还存在民族自决等集体人权。"},{"label":"B","text":"人权是指宪法中规定的公民基本权利","reason":"公民基本权利是法定表达，不能与全部人权画等号。"},{"label":"C","text":"马克思主义法学认为，人权是历史发展的产物","reason":"马克思主义认为人权是历史形成的。"},{"label":"D","text":"人权具有超时代性，所以人权价值属于本源性价值","reason":"本源性指其他权利的正当根据，不是超时代。"}],"answer":"ABD","multiple":true,"summary":"人权包括个体、集体，随历史发展，不能等同公民基本权利。","file":"【解析版】26法理母子题第三、四期，杜洪波，20250528.pdf","page":13,"note":"","typeConflict":false},{"uid":"j-6b17775aac53575b","n":137,"sourceId":"30-3","chapter":"第五章 法的价值","section":"第二节 法的价值分类","topic":"30｜人权价值","kind":"母题","stem":"下列关于人权的表述，正确的是（）（2016年法学单选第3题）","options":[{"label":"A","text":"人权就是指公民权利和政治权利","reason":"还包括经济、社会、文化等权利。"},{"label":"B","text":"人权价值可作为立法与司法的指导","reason":"人权能为法律制定、适用提供方向。"},{"label":"C","text":"人权是超越时代和历史的基本权利","reason":"人权具有历史性，不是超越一切时代。"},{"label":"D","text":"人权的主体是公民，其内容由宪法加以规定","reason":"主体是人，不能限于本国公民和宪法已列权利。"}],"answer":"B","multiple":false,"summary":"人权内容很广，既指导立法也指导司法，并受历史条件影响。","file":"【解析版】26法理母子题第三、四期，杜洪波，20250528.pdf","page":13,"note":"","typeConflict":false},{"uid":"j-ee8970af6e75c502","n":138,"sourceId":"30-1-1","chapter":"第五章 法的价值","section":"第二节 法的价值分类","topic":"30｜人权价值","kind":"子题","stem":"下列关于人权价值的表述，正确的是（）【单】","options":[{"label":"A","text":"人权是指人们实际享有的那些权利","reason":"还包括人应当享有但尚未落实的权利。"},{"label":"B","text":"人权表达的是人格上的普遍平等和绝对尊严","reason":"因为是人，就应有平等人格与尊严。"},{"label":"C","text":"公民权是人权的基础","reason":"方向反了，人权为公民权提供正当根据。"},{"label":"D","text":"人权的范围是固定的","reason":"人权范围和保障方式会随历史发展。"}],"answer":"B","multiple":false,"summary":"人权既含现实权利也含应有权利，是法定权利的价值基础。","file":"【解析版】26法理母子题第三、四期，杜洪波，20250528.pdf","page":14,"note":"","typeConflict":false},{"uid":"j-a34b1c09e2f95835","n":139,"sourceId":"30-1-2","chapter":"第五章 法的价值","section":"第二节 法的价值分类","topic":"30｜人权价值","kind":"子题","stem":"下列哪一表述说明人权在本原上具有历史性（）【单】","options":[{"label":"A","text":"“根据自然法，一切人生而自由，既不知有奴隶，也就无所谓释放”","reason":"这是自然法永恒、人生而自由的思想。"},{"label":"B","text":"“没有无义务的权利，也没有无权利的义务”","reason":"这是权利义务相联系，不是在讲历史条件。"},{"label":"C","text":"“人人生而平等，他们都从他们的‘造物主’那里被赋予某些不可转让的权利”","reason":"这是天赋人权思想，不是历史生成论。"},{"label":"D","text":"“权利永远不能超出社会的经济结构以及由经济结构所制约的文化发展”","reason":"明确说权利受经济文化条件制约，正合题意。"}],"answer":"D","multiple":false,"summary":"受经济、文化发展制约，才是在讲人权的历史性。","file":"【解析版】26法理母子题第三、四期，杜洪波，20250528.pdf","page":14,"note":"","typeConflict":false},{"uid":"j-9b3b6bdff7b57895","n":140,"sourceId":"30-2-1","chapter":"第五章 法的价值","section":"第二节 法的价值分类","topic":"30｜人权价值","kind":"子题","stem":"商鞅以“百人逐兔”描述法的作用和价值：“一兔走，百人逐之，非以兔可分以为百也，由名分之未定也。夫卖兔者满市，而盗不敢取，由名分已定也”。下列理解正确的是（）【单】","options":[{"label":"A","text":"强调了法律的人权价值","reason":"重点是确定归属、维持秩序，不是专讲人权。"},{"label":"B","text":"认为只有法律才能“定名分”","reason":"道德等方式也能确认名分，不能说只有法律。"},{"label":"C","text":"符合法律至上的现代法治精神","reason":"古代主张不能直接等同现代法律至上原则。"},{"label":"D","text":"“盗不敢取”涉及法的指引作用","reason":"知道归属而不  const a=state.answers[q.uid],done=answered(q),selected=done?a.selected:state.drafts[q.uid]||[],multi=q.multiple;
 let html='<div class="q-head"><span class="q-number">#'+q.n+'</span><span class="badge'+(multi?' multi':'')+'">'+(multi?'多选':'单选')+'</span><span class="badge">'+esc(q.kind)+'</span><span class="source-id">原题 '+esc(q.sourceId)+'</span></div><h3 class="stem" id="stem-'+q.uid+'">'+esc(q.stem)+'</h3><div class="choices" role="group" aria-labelledby="stem-'+q.uid+'">';
 for(const o of q.options){const chosen=selected.includes(o.label),right=q.answer.includes(o.label);html+='<div class="option'+(done?' done '+(right?'correct':'incorrect'):'')+'"><label class="choice"><input type="'+(multi?'checkbox':'radio')+'" name="'+q.uid+'" value="'+o.label+'"'+(chosen?' checked':'')+(done?' disabled':'')+'><span class="letter">'+o.label+'</span><span class="choice-text">'+esc(o.text)+'</span>'+(done&&chosen?'<span class="chosen">你选</span>':'')+'</label>'+(done&&o.reason?'<div class="reason"><b>解析</b>'+esc(o.reason)+'</div>':'')+'</div>';}
 html+='</div>';
 if(!done&&q.typeConflict)html+='<div class="source-note">原书题型标记有误，本页按'+(multi?'多选':'单选')+'作答；核对说明将在作答后显示。</div>';
 if(!done&&multi)html+='<div class="submit-row"><button class="primary" data-action="submit"'+(!selected.length?' disabled':'')+'>确认答案</button><span class="submit-hint">选好后再确认</span></div>';
 if(done){html+='<div class="result"><div class="result-title'+(!a.correct?' wrong':'')+'" tabindex="-1"><strong>'+(a.correct?'回答正确':'本题答错')+'</strong><span>正确答案 '+q.answer+' · 你的选择 '+selected.join('')+'</span></div><p class="summary"><b>简析</b>'+esc(q.summary)+'</p>'+(q.note?'<div class="source-note">'+esc(q.note)+'</div>':'')+(q.originalAnalysis?'<details class="original"><summary>核对原书解析</summary><p>'+esc(q.originalAnalysis)+'</p></details>':'')+'<div class="q-actions"><button data-action="retry">重做本题</button><button data-action="collect" class="'+(state.wrong[q.uid]?'collected':'')+'">'+(state.wrong[q.uid]?'移出错题本':'加入错题本')+'</button><button data-action="next">下一道未完成</button></div><div class="source-line">'+esc(q.file)+' · PDF第'+q.page+'页</div></div>';}
 return html;
}
function filtered(){const term=state.search.trim().toLowerCase();return QUESTIONS.filter(q=>(term||q.chapter===state.chapter)&&(state.mode!=='todo'||!answered(q))&&(state.mode!=='wrong'||state.wrong[q.uid])&&(!term||[q.stem,q.topic,q.sourceId,...q.options.map(o=>o.text)].join(' ').toLowerCase().includes(term)));}
function render(restore=false){
 const rows=filtered(),searching=!!state.search.trim(),name=searching?'搜索结果':state.chapter,mode={all:'全部题目',todo:'未完成',wrong:'错题本'}[state.mode];
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));
 let html='<div class="section-head"><div><h2>'+esc(name)+'</h2><p>'+mode+' · '+rows.length+'题'+(state.mode==='wrong'?' · 做对后可自行移出':'')+'</p></div><button class="continue" id="continue">继续未完成</button></div>';
 let previous='';for(const q of rows){const topic=(searching?q.chapter+' · ':'')+'考点 '+q.topic;if(topic!==previous){html+='<h2 class="topic-title">'+esc(topic)+'</h2>';previous=topic;}html+='<article class="question" data-uid="'+q.uid+'">'+questionHTML(q)+'</article>';}
 if(!rows.length)html+='<div class="empty"><strong>'+(state.mode==='wrong'?'本章暂时没有错题':state.mode==='todo'?'本章已经完成':'没有找到对应题目')+'</strong>'+(state.mode==='wrong'?'答错会自动收录，也可以在答题后手动加入。':'可切换章节或调整搜索条件。')+'</div>';
 $('main').innerHTML=html+'<p class="bottom-note">题干与选项保留资料原文 · 每题作答后显示该题答案与解析</p>';stats();
 if(restore)requestAnimationFrame(()=>window.scrollTo(0,state.scroll[positionKey()]||0));
}
function setMenu(open){document.body.classList.toggle('nav-open',open);$('menu').setAttribute('aria-expanded',String(open));}
function navigate(ch,uid=''){remember();state.chapter=ch;state.search='';$('search').value='';save();render(true);renderNav(true);setMenu(false);if(uid)requestAnimationFrame(()=>document.querySelector('article[data-uid="'+uid+'"]')?.scrollIntoView({block:'start',behavior:'smooth'}));}
function updateQuestion(q){const article=document.querySelector('article[data-uid="'+q.uid+'"]');if(article){article.innerHTML=questionHTML(q);article.querySelector('.result-title')?.focus({preventScroll:true});}stats();}
function submit(q){if(answered(q))return;const selected=(state.drafts[q.uid]||[]).slice().sort();if(!selected.length)return;const correct=selected.join('')===q.answer,old=state.answers[q.uid];state.answers[q.uid]={selected,correct,submitted:true,tries:(old?.tries||0)+1,wrongTimes:(old?.wrongTimes||0)+(correct?0:1),at:Date.now()};if(!correct)state.wrong[q.uid]=true;state.last=q.uid;save();updateQuestion(q);}
function nextQuestion(after=''){const index=QUESTIONS.findIndex(q=>q.uid===after),loop=[...QUESTIONS.slice(index+1),...QUESTIONS.slice(0,index+1)],next=loop.find(q=>!answered(q));if(!next){toast('347题均已完成，可以到错题本复盘。');return;}state.mode='all';navigate(next.chapter,next.uid);}
$('main').addEventListener('change',e=>{if(!e.target.matches('input[name]'))return;const q=BY_ID.get(e.target.closest('article').dataset.uid);if(!q||answered(q))return;const selected=[...e.target.closest('.choices').querySelectorAll('input:checked')].map(i=>i.value).sort();state.drafts[q.uid]=selected;state.last=q.uid;save();if(!q.multiple)submit(q);else e.target.closest('article').querySelector('[data-action=submit]').disabled=!selected.length;});
$('main').addEventListener('click',e=>{
 if(e.target.closest('#continue')){nextQuestion(state.last);return;}const btn=e.target.closest('[data-action]');if(!btn)return;const q=BY_ID.get(btn.closest('article').dataset.uid);if(!q)return;
 if(btn.dataset.action==='submit')submit(q);
 if(btn.dataset.action==='retry'){const old=state.answers[q.uid];if(old)old.submitted=false;delete state.drafts[q.uid];save();updateQuestion(q);}
 if(btn.dataset.action==='collect'){if(state.wrong[q.uid])delete state.wrong[q.uid];else state.wrong[q.uid]=true;save();if(state.mode==='wrong'){remember();render(true);}else updateQuestion(q);}
 if(btn.dataset.action==='next')nextQuestion(q.uid);
});
$('chapters').addEventListener('click',e=>{const b=e.target.closest('[data-chapter]');if(b)navigate(CHAPTERS[Number(b.dataset.chapter)]);});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{remember();state.mode=b.dataset.mode;save();render(true);}));
$('search').value=state.search;$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{remember();state.search=$('search').value;save();render();},180);});
$('menu').addEventListener('click',()=>setMenu(!document.body.classList.contains('nav-open')));$('shade').addEventListener('click',()=>setMenu(false));document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false);});
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function md(s){return String(s).replace(/([\\`*_{}\[\]<>])/g,'\\$1');}
function wrongMarkdown(){
 const rows=QUESTIONS.filter(q=>state.wrong[q.uid]);let out='# 法理学母子题 · 错题本\n\n共 '+rows.length+' 题。\n\n',chapter='';
 for(const q of rows){if(q.chapter!==chapter){chapter=q.chapter;out+='## '+md(chapter)+'\n\n';}const a=state.answers[q.uid];out+='### '+q.n+'｜原题 '+md(q.sourceId)+' · '+md(q.topic.split('｜').slice(1).join('｜'))+'\n\n'+md(q.stem)+'\n\n';for(const o of q.options)out+=o.label+'. '+md(o.text)+'\n\n';out+='**正确答案：'+q.answer+'**'+(a?.submitted?'　你的选择：'+a.selected.join(''):'')+'\n\n';for(const o of q.options)if(o.reason)out+='- '+o.label+'：'+md(o.reason)+'\n';out+='\n**简析：**'+md(q.summary)+'\n\n';if(q.note)out+='> 原书核对：'+md(q.note)+'\n\n';out+='来源：'+md(q.file)+'，PDF第'+q.page+'页。\n\n';}return out;
}
$('export').addEventListener('click',()=>{if(!QUESTIONS.some(q=>state.wrong[q.uid]))return;download('法理学母子题_错题本_'+new Date().toLocaleDateString('sv-SE')+'.md',wrongMarkdown(),'text/markdown;charset=utf-8');});
$('backup').addEventListener('click',()=>{remember();save();download('法理学母子题_进度备份_'+new Date().toLocaleDateString('sv-SE')+'.json',JSON.stringify(state,null,2),'application/json');$('progress-menu').open=false;});
$('restore').addEventListener('click',()=>$('restore-file').click());$('restore-file').addEventListener('change',async()=>{const f=$('restore-file').files[0];if(!f)return;try{if(f.size>10000000)throw Error('文件过大');const imported=validateState(JSON.parse(await f.text()));const old=state;state=imported;if(!save()){state=old;throw Error('本机保存失败');}$('search').value=state.search;render(true);toast('进度已恢复。');}catch{toast('无法恢复，请选择本页面导出的进度JSON。');}$('restore-file').value='';$('progress-menu').open=false;});
window.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{remember();save();},400);},{passive:true});window.addEventListener('pagehide',()=>{remember();save();});document.addEventListener('visibilitychange',()=>{if(document.hidden){remember();save();}});setInterval(()=>{remember();save();},30000);
render(true);if(loadError)toast(loadError);
</script></body></html>
